<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RadarMapa RJ - DER</title>
    
    <!-- Tailwind CSS (Framework de Estilos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#64748b',
                        dark: '#0f172a',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        success: '#10b981'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS (Estilos base do Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <!-- O Nosso CSS Customizado (Atualizado para v5 para QUEBRAR o Cache) -->
    <link rel="stylesheet" href="estilo.css?v=5">

    <!-- Proteção CSS para as imagens do Leaflet não colidirem com o Tailwind -->
    <style>
        .leaflet-container img.leaflet-tile {
            max-width: none !important;
            max-height: none !important;
        }
    </style>
</head>
<body class="antialiased text-slate-800 h-screen w-screen overflow-hidden bg-slate-200">

    <!-- Ecrã de Carregamento (Overlay) -->
    <div id="loading-overlay" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="loader mb-4" style="border: 4px solid #f3f4f6; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        <h2 class="text-xl font-bold text-dark">RadarMapa RJ</h2>
        <p class="text-secondary text-sm mt-2">A sincronizar dados do DER-RJ...</p>
    </div>

    <!-- Contentor Principal do Mapa -->
    <div class="relative w-full h-full">
        <!-- Div do Mapa -->
        <div id="map" class="absolute inset-0 z-[1]" style="width: 100vw; height: 100vh;"></div>

        <!-- Barra de Navegação Superior (Pesquisa) -->
        <header class="absolute top-4 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-full md:max-w-md z-[1000] pointer-events-none">
            <div class="glass-panel rounded-2xl p-2 flex items-center gap-2 pointer-events-auto shadow-lg bg-white/95 backdrop-blur-md border border-white/50">
                <button class="w-10 h-10 rounded-xl hover:bg-slate-100/50 flex items-center justify-center text-secondary transition-colors" aria-label="Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
                
                <div class="flex-1 px-2">
                    <form id="search-form" class="w-full bg-slate-100/80 rounded-xl px-4 py-2 flex items-center gap-2 text-sm text-secondary border border-transparent focus-within:border-primary focus-within:bg-white transition-colors shadow-inner">
                        <i class="fa-solid fa-magnifying-glass opacity-50"></i>
                        <input type="text" id="search-input" class="bg-transparent border-none outline-none w-full text-dark placeholder-slate-400" placeholder="Pesquisar endereço (ex: Copacabana)...">
                        <button type="submit" class="hidden">Pesquisar</button>
                    </form>
                </div>

                <div class="w-10 h-10 rounded-xl bg-primary/10 text-primary flex items-center justify-center font-bold text-sm shrink-0">
                    RJ
                </div>
            </div>
        </header>

        <!-- Botões de Ação Flutuantes (Canto Inferior Direito) -->
        <div class="absolute bottom-6 right-4 z-[1000] flex flex-col gap-3">
            <button id="btn-center-map" class="w-12 h-12 glass-panel bg-white/95 backdrop-blur-md rounded-full flex items-center justify-center text-dark shadow-lg hover:bg-slate-50 transition-colors border border-white/50" aria-label="Centrar Mapa">
                <i class="fa-solid fa-location-crosshairs text-xl"></i>
            </button>
            
            <button id="btn-toggle-filters" onclick="document.getElementById('filters-panel').classList.toggle('translate-y-full'); document.getElementById('filters-panel').classList.toggle('md:translate-x-full');" class="w-14 h-14 bg-dark text-white rounded-2xl flex items-center justify-center shadow-xl hover:bg-slate-800 transition-all transform hover:scale-105 relative" aria-label="Filtros">
                <i class="fa-solid fa-layer-group text-xl"></i>
                <span id="filter-badge" class="absolute -top-1 -right-1 bg-primary text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">4</span>
            </button>
        </div>

        <!-- Painel de Filtros -->
        <aside id="filters-panel" class="fixed inset-x-0 bottom-0 md:inset-y-0 md:right-0 md:left-auto md:w-96 bg-white z-[1001] rounded-t-3xl md:rounded-l-3xl md:rounded-tr-none shadow-2xl transform translate-y-full md:translate-y-0 md:translate-x-full transition-transform duration-300 flex flex-col h-[75vh] md:h-full">
            
            <div class="p-6 border-b border-slate-100 flex items-center justify-between shrink-0">
                <div>
                    <h3 class="text-xl font-bold text-dark">Filtros do Mapa</h3>
                    <p class="text-sm text-secondary">A controlar <span id="total-radars-count" class="font-bold text-primary">0</span> radares</p>
                </div>
                <button id="btn-close-filters" onclick="document.getElementById('filters-panel').classList.add('translate-y-full', 'md:translate-x-full');" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto overflow-x-hidden flex-1" style="scrollbar-width: none; -ms-overflow-style: none;">
                <!-- Master Toggle -->
                <div class="flex items-center justify-between mb-8 p-4 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="font-semibold text-dark">Mostrar todos no mapa</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="filter-all" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                    </label>
                </div>

                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Categorias</h4>
                
                <div class="space-y-4">
                    <!-- Fixo Ativo -->
                    <label class="flex items-center justify-between group cursor-pointer p-2 hover:bg-slate-50 rounded-lg transition-colors">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-danger/10 text-danger flex items-center justify-center text-lg"><i class="fa-solid fa-video"></i></div>
                            <div>
                                <p class="font-semibold text-dark text-sm">Radar Fixo</p>
                                <p class="text-xs text-secondary">A operar normalmente</p>
                            </div>
                        </div>
                        <input type="checkbox" class="radar-filter w-5 h-5 accent-primary rounded border-slate-300 text-primary focus:ring-primary" value="fixo-ativo" checked>
                    </label>

                    <!-- Fixo Inativo -->
                    <label class="flex items-center justify-between group cursor-pointer p-2 hover:bg-slate-50 rounded-lg transition-colors">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-lg"><i class="fa-solid fa-video-slash"></i></div>
                            <div>
                                <p class="font-semibold text-dark text-sm">Fixo Inativo</p>
                                <p class="text-xs text-secondary">Desligado / Em manutenção</p>
                            </div>
                        </div>
                        <input type="checkbox" class="radar-filter w-5 h-5 accent-primary rounded border-slate-300 text-primary focus:ring-primary" value="fixo-inativo" checked>
                    </label>

                    <!-- Portátil Ativo -->
                    <label class="flex items-center justify-between group cursor-pointer p-2 hover:bg-slate-50 rounded-lg transition-colors">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-warning/10 text-warning flex items-center justify-center text-lg"><i class="fa-solid fa-camera"></i></div>
                            <div>
                                <p class="font-semibold text-dark text-sm">Radar Portátil</p>
                                <p class="text-xs text-secondary">Tripés operacionais</p>
                            </div>
                        </div>
                        <input type="checkbox" class="radar-filter w-5 h-5 accent-primary rounded border-slate-300 text-primary focus:ring-primary" value="portatil-ativo" checked>
                    </label>

                    <!-- Portátil Inativo -->
                    <label class="flex items-center justify-between group cursor-pointer p-2 hover:bg-slate-50 rounded-lg transition-colors">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-lg"><i class="fa-solid fa-camera"></i></div>
                            <div>
                                <p class="font-semibold text-dark text-sm">Portátil Inativo</p>
                                <p class="text-xs text-secondary">Ponto conhecido s/ equipamento</p>
                            </div>
                        </div>
                        <input type="checkbox" class="radar-filter w-5 h-5 accent-primary rounded border-slate-300 text-primary focus:ring-primary" value="portatil-inativo" checked>
                    </label>
                </div>
            </div>
            
            <div class="p-4 bg-slate-50 border-t border-slate-100 text-center text-xs text-slate-400 shrink-0">
                Dados atualizados com base no DER-RJ
            </div>
        </aside>

        <!-- Toast de Notificação -->
        <div id="notification-toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-dark text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-[2000] opacity-0 pointer-events-none transition-opacity duration-300">
            <i id="toast-icon" class="fa-solid fa-circle-info text-primary"></i>
            <span id="toast-msg" class="text-sm font-medium">Notificação</span>
        </div>
    </div>

    <!-- Scripts de Terceiros -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- O Nosso JavaScript Customizado (Atualizado para v5 para QUEBRAR o Cache) -->
    <script src="app.js?v=5"></script>

    <!-- MEGA PATCH: Motor contínuo para curar a "tela cinzenta" do Leaflet -->
    <script>
        window.addEventListener('load', function() {
            // Tenta redimensionar a cada 300ms durante os primeiros 4 segundos para garantir que o mapa acorda
            let attempts = 0;
            let interval = setInterval(function() {
                window.dispatchEvent(new Event('resize'));
                if (typeof AppState !== 'undefined' && AppState.map) {
                    AppState.map.invalidateSize();
                }
                attempts++;
                if (attempts > 12) clearInterval(interval);
            }, 300);
        });
    </script>
</body>
</html>
